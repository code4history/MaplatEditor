# electron-builder は pnpm 既定の symlink 配置から推移的依存を収集できず、
# asar に直接依存しか入らない(packaged 版で jimp/@duckdb が ERR_MODULE_NOT_FOUND)。
# hoisted(フラット実体配置)にすると全依存ツリーが正しく asar へ収集される
nodeLinker: hoisted

# build script 許可リスト。pnpm 11 で onlyBuiltDependencies(リスト形式)は廃止され
# allowBuilds(マップ形式)に置換された(旧キーは警告なしで無視される)。
# pnpm 9/10/11初期との両対応のため新旧両形式を併記する
allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: true
  less: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild
  - less

# FOSS4Gリリーストレイン: @maplat/ui(gitブランチ参照)の依存に@maplat/core(git参照)が
# 含まれるため、意図的にexotic subdepsを許可する(FOSS4G前のnpm一斉publish後に戻す)
blockExoticSubdeps: false
