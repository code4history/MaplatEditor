name: Build and Release

on:
  # 署名ポリシー（m6-t12 §2.4。Windows の eSigner は署名ごとに課金されるため、署名・公証・リリースは明示的な手動操作に限定）:
  #   push（master / glm52 / foss4g-hiroshima）: ビルドのみ（署名・公証なし）。
  #     ※ 旧仕様にあった「master push で Mac 署名のみ」は m6-t12 で廃止した — 署名系 secrets を
  #        environment `release`（Required reviewers 保護）へ隔離したため push ビルドからは読めない。
  #        テスター配布用の署名済みバイナリは master で release=true を実行して得ること。
  #   手動実行: ブランチ問わず起動可能。通常は署名なしビルド。
  #     「release」チェックで Mac 署名+公証 / Win eSigner 署名 / draft Release 作成を行う。
  #     許可条件は master、または prerelease バージョン（version に '-' を含む。例 1.0.0-rc1）の
  #     任意ブランチ（判定の単一実装: scripts/m6-t12/check-release-guard.mjs）。
  push:
    branches: [master, glm52, foss4g-hiroshima]
  workflow_dispatch:
    inputs:
      release:
        description: 'リリースビルド（Mac 公証 + Win eSigner 署名 + draft Release 作成。eSigner の署名回数を消費。master か prerelease バージョン限定）'
        type: boolean
        default: false
      skip_notarize:
        description: 'Mac の公証を省く（署名のみ。Apple の公証キューが滞留しているときの回避用。Gatekeeper の警告は出る）'
        type: boolean
        default: false

permissions:
  contents: write  # GitHub Release 作成に必要

jobs:
  # ─────────────────────────────────────────────
  # バージョン番号取得 + release ガード（全ジョブで共有）
  # ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from package.json
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      # リリースビルドの許可判定（m6-t12 §2.2）。version 取得後に置くのが要点
      # （prerelease 判定に version が必要）。判定ロジックは smoke（AC3）と同一実装
      - name: Guard release trigger
        env:
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/m6-t12/check-release-guard.mjs

  # ─────────────────────────────────────────────
  # macOS ビルド（x64 + arm64 DMG）
  # ─────────────────────────────────────────────
  build-mac:
    needs: prepare
    runs-on: macos-latest
    # 公証は Apple のキュー次第で長引く。既定（360分）のままだと応答が返らないときに
    # 6時間まるごと消費してから cancelled になる（m6-t12 AC7 の初回実走で実測）。
    # ビルド 5分 + 公証（x64/arm64 の2回）に十分な余裕を見つつ、早く失敗させる
    timeout-minutes: 120
    # 署名系 secrets は environment `release` に置く（m6-t12 §2.4）。release 実行時のみ
    # Required reviewers の承認が挟まり、push ビルド（ci 側）からは secrets を読めない
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && 'release' || 'ci' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（latest 追従による突然の挙動変化を防ぐ）。
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install

      # Developer ID 証明書のインポート（release 実行のみ。m6-t12 で master push 署名経路を廃止）
      # インポート成功時に MAC_SIGN=true を設定 → electron-builder が Hardened Runtime 付き署名を行う
      # （Secret 未設定の場合はスクリプト内でスキップ）
      # ※ secrets コンテキストは if: 条件式では使用不可のため、シェル内で判定する
      - name: Import Apple Developer certificate
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-mac
        run: |
          if [ -z "$APPLE_CERT_BASE64" ]; then
            echo "APPLE_CERT_BASE64 が未設定のため証明書インポートをスキップします。"
            exit 0
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          echo "MAC_SIGN=true" >> $GITHUB_ENV

      # 公証環境変数のセット（リリースビルドのみ）
      # ※ 空文字を env: に渡すと electron-builder が誤動作するため $GITHUB_ENV 経由で設定
      # skip_notarize が true のときは APPLE_ID を渡さない。notarize.cjs は APPLE_ID 不在で
      # スキップする既存経路を持つため（scripts/notarize/notarize.cjs:14）、署名済み・未公証の
      # DMG がそのまま得られる。Apple の公証キューが滞留したとき（m6-t12 AC7 で 7 時間超の
      # In Progress を実測）にビルド全体を止めないための逃げ道である
      - name: Set macOS notarization environment
        if: github.event_name == 'workflow_dispatch' && inputs.release && !inputs.skip_notarize
        shell: bash
        env:
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_APPLE_ID" ]; then
            echo "APPLE_ID=$_APPLE_ID" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=$_APPLE_APP_SPECIFIC_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID" >> $GITHUB_ENV
          fi

      - name: Build macOS
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/${{ env.VERSION }}/*.dmg
            release/${{ env.VERSION }}/*.dmg.blockmap
            release/${{ env.VERSION }}/latest-mac.yml

  # ─────────────────────────────────────────────
  # Windows ビルド（x64 + arm64 NSIS インストーラ）
  # ─────────────────────────────────────────────
  build-win:
    needs: prepare
    runs-on: windows-latest
    # 実測 4分台。eSigner の応答待ちを見込んでも 45 分あれば十分（早期失敗のため）
    timeout-minutes: 45
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && 'release' || 'ci' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（latest 追従による突然の挙動変化を防ぐ）。
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows
        run: pnpm run dist:win

      # eSigner による post-build 署名（m6-t12 §2.3・release 実行のみ）。
      # 署名対象は file_path で明示した Setup.exe 2本のみ = 署名回数 2/リリース
      # （eSigner は署名ごとに課金・§7-2 方針）。dir_path（batch_sign）を使わないのは、
      # 署名不可ファイル（latest.yml / *.blockmap）混在時の挙動が action 側で未文書化のため
      # （実装レビュー IR-1: 課金付き経路に未確認挙動を置かない）。
      # ファイル名は electron-builder.config.cjs の artifactName
      # '${productName}-Windows-${version}-${arch}-Setup.${ext}'（productName=MaplatEditor）から決定的。
      # electron-builder の win.sign hook を使わない理由・アプリ本体 exe を署名しない
      # トレードオフは docs/release-signing.md を参照
      - name: Sign Windows installer x64 (SSL.com eSigner)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-x64-Setup.exe
          override: 'true'
          environment_name: PROD

      - name: Sign Windows installer arm64 (SSL.com eSigner)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-arm64-Setup.exe
          override: 'true'
          environment_name: PROD

      # 署名でバイナリが変わったため、latest.yml の sha512/size と .exe.blockmap を
      # 署名済みバイナリから再生成する（怠ると auto-update が壊れる /
      # 差分更新が常時全量フォールバックする。m6-t12 §2.3・AC5）
      - name: Update auto-update metadata after signing
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: node scripts/m6-t12/resign-update-metadata.mjs release/${{ env.VERSION }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            release/${{ env.VERSION }}/*.exe
            release/${{ env.VERSION }}/*.exe.blockmap
            release/${{ env.VERSION }}/latest.yml

  # ─────────────────────────────────────────────
  # Linux ビルド（x64 + arm64 AppImage・署名なし＝現行方針）
  # ─────────────────────────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    # 実測 1分半。署名を伴わないため短く倒す
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（latest 追従による突然の挙動変化を防ぐ）。
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install Linux build dependencies
        run: sudo apt-get install -y rpm

      - name: Build Linux
        run: pnpm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/${{ env.VERSION }}/*.AppImage
            release/${{ env.VERSION }}/latest-linux.yml

  # ─────────────────────────────────────────────
  # GitHub Release 作成（手動リリースビルドのみ。許可条件は prepare の Guard で担保）
  # ─────────────────────────────────────────────
  release:
    needs: [prepare, build-mac, build-win, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && 'release' || 'ci' }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: MaplatEditor v${{ needs.prepare.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
