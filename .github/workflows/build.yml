name: Build and Release
# 承認スクリプト（outer の scripts/release-train/examples/2026-11/editor-approve.sh・editor-m7-signed-2-approve.sh）は
# この表示名で自分の起動であることを照合する ∴ 書式を 1 文字も変えない（nov26-m7-t2・C-10。smoke が式を断言する）
run-name: ${{ github.event_name == 'workflow_dispatch' && format('dispatch mode={0} signer={1} sha={2} ver={3}', inputs.mode, inputs.win_signer, inputs.expected_editor_sha, inputs.expected_version) || format('push {0}', github.sha) }}

on:
  # 署名ポリシー（m6-t12 §2.4 / 人間決定 D6・2026-08-08）。2軸で指定する:
  #
  #   mode=verify（既定・動作確認用）: Mac 署名のみ / Win 署名なし / draft Release なし
  #     Apple は年額で署名ごとの課金がなく eSigner も呼ばないため **課金ゼロ**。∴ 全バージョン・全ブランチ可
  #   mode=full（完全）:               Mac 署名+公証 / Win 全 PE 署名 / draft Release 作成
  #     **rc 以降**に限定（prerelease は rc 始まりのみ。正式版は master 限定。判定は scripts/m6-t12/check-release-guard.mjs）。
  #     Windows は配布物の全 PE を署名する（2026-10-03・SAC 起動拒否への対処）。署名者は win_signer で選ぶ:
  #       artifact-signing（既定・nov26-m7-t2）… Azure Artifact Signing（定額 5,000 署名／月）。署名は依存を入れない
  #         署名専用ジョブ（sign-win-payload・sign-win-uninstaller・sign-win-installer）だけが行い、OIDC の要求口
  #         （id-token: write）はそのジョブにしか無い（C-8）。承認の待ちは最大 4 回（build-mac＋build-win・署名専用 3 つ）
  #       esigner（J-7 の退路）… SSL.com eSigner（署名ごとに課金）。build-win の中で electron-builder のフックが署名し、
  #         DLL 等は署名済みキャッシュ（Release `win-signed-cache`）から使い回す
  #
  #   mode=sign-check（nov26-m7-t2）: Mac 署名のみ（公証なし）/ Win は Artifact Signing で全 PE 署名 / draft Release なし。
  #     署名の経路を本番の前に確かめる用途。定額で配布物も作らないので rc の制限は課さないが、expected_editor_sha・
  #     expected_version は必須で、master の祖先でない SHA は prepare が拒む。win_signer=esigner は拒む。
  #     win-artifacts の保持は 3 日
  #
  #   platforms=all|mac|win|linux: 対象を絞れる。Apple の公証が復旧したときに
  #     「Mac だけ焼き直す」（mac + full）が eSigner を再課金せずにできる
  #
  #   push（master / glm52 / foss4g-hiroshima）: Mac は Developer ID 署名のみ（公証なし・課金ゼロ）、
  #     Win / Linux は署名しない。Mac 証明書2 secrets は environment `ci` にも置く（t1・2026-08-21。
  #     dispatch 忘れによる未署名配布事故を受けた人間指示で、m6-t12 の「push では署名しない」を部分差し戻し）。
  #     公証・eSigner・Release 作成は従来どおり `release`（Required reviewers 保護）の dispatch 限定
  push:
    branches: [master, glm52, foss4g-hiroshima]
  workflow_dispatch:
    inputs:
      mode:
        description: '署名レベル'
        type: choice
        default: verify
        options:
          - verify   # 動作確認用: Mac 署名のみ / Win 署名なし / Release 作らない（課金ゼロ・全バージョン可）
          - sign-check # 署名確認:  Mac 署名のみ / Win Artifact Signing で全 PE 署名 / Release 作らない（定額・宣言した master の SHA だけ）
          - full     # 完全:       Mac 署名+公証 / Win 全 PE 署名（win_signer）/ draft Release（rc 以降限定）
      platforms:
        description: 'ビルド対象'
        type: choice
        default: all
        options: [all, mac, win, linux]
      # #104 / oct26-m4-t2: exact commit SHA 宣言。mode=full では必須（check-release-guard.mjs が検証）。
      # リポジトリ内の自己参照ファイル（release-manifest.json）は作らず、宣言は dispatch 入力で渡す。
      # 照合の正は prepare が git rev-parse HEAD から生成する build-meta.json.editor_sha（AC-7 契約 (b)）。
      expected_editor_sha:
        description: 'ビルド対象 commit の40桁 SHA（mode=full では必須。全 checkout をこの SHA へ固定）'
        type: string
        required: false
      expected_version:
        description: '期待する配布バージョン（mode=full では必須。package.json の version と一致すること）'
        type: string
        required: false
      # nov26-m7-t2: Windows の署名者。sign-check は artifact-signing だけ（esigner は prepare が拒む）
      win_signer:
        description: 'Windows の署名者（artifact-signing＝Azure Artifact Signing・既定 / esigner＝SSL.com eSigner・課金の退路）'
        type: choice
        default: artifact-signing
        options: [artifact-signing, esigner]

# GITHUB_TOKEN は既定を read に絞り、contents: write は Release を作る release ジョブへ
# job 単位で与える（セキュリティレビュー SR-t12-M-1・2026-08-08）。
# workflow レベルに write を置くとビルド3ジョブのトークンにも書き込み権限が乗り、
# checkout が .git/config へ残したトークン（既定 persist-credentials: true）を経由して、
# ビルド時に走る依存ツリー（vite / vue-tsc / electron-builder のプラグイン群）の汚染が
# そのままリポジトリ書き込みに直結する。署名パイプラインではそれは「次に署名される内容を
# 書き換えられる」ことを意味し、外部 action を SHA ピンする脅威モデルと矛盾する。
# 回帰止めは smoke の AC11。
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # バージョン番号取得 + 実行可否ガード（全ジョブで共有）
  # ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      # nov26-m7-t2: Windows の署名の経路（none / artifact-signing / esigner）。後段の if: はこれだけを見る
      win_sign_path: ${{ steps.win-sign-path.outputs.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # #104: 全 checkout を expected_editor_sha（mode=full で必須）へ固定する。
          # push では inputs が空のため、actions/checkout の既定 ref（トリガー commit）へフォールバックする。
          persist-credentials: false
          ref: ${{ inputs.expected_editor_sha }}
          # nov26-m7-t2（#140 L-1）: 祖先の確認に origin/master の履歴が要る
          fetch-depth: 0

      # nov26-m7-t2（#140 L-1）: 署名するのは master の祖先の SHA だけ。checkout の直後の最初の step で、
      # リポジトリのファイルを呼ばずに確かめる（この step は dispatch された ref＝master の workflow のもの）
      - name: Verify expected_editor_sha is an ancestor of master
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.expected_editor_sha }}
        run: |
          set -euo pipefail
          case "${EVENT}:${MODE}" in
            workflow_dispatch:full|workflow_dispatch:sign-check)
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_editor_sha が 40 桁 hex でない"; exit 1; }
              [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout が expected_editor_sha を指していない"; exit 1; }
              git merge-base --is-ancestor "$SHA" refs/remotes/origin/master || { echo "::error::$SHA は origin/master の祖先ではない"; exit 1; } ;;
            *) echo "祖先の確認は mode=full・sign-check のときだけ（${EVENT}:${MODE}）" ;;
          esac

      # nov26-m7-t2: Windows の署名の経路をインラインで決める（リポジトリのコードは使わない）
      - name: Decide the Windows signing path
        id: win-sign-path
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SIGNER: ${{ inputs.win_signer }}
        run: |
          set -euo pipefail
          signer="${SIGNER:-artifact-signing}"
          case "${EVENT}:${MODE}:${signer}" in
            workflow_dispatch:sign-check:artifact-signing|workflow_dispatch:full:artifact-signing) p=artifact-signing ;;
            workflow_dispatch:full:esigner) p=esigner ;;
            workflow_dispatch:sign-check:*) echo "::error::mode=sign-check は win_signer=artifact-signing だけ（${signer}）"; exit 1 ;;
            workflow_dispatch:full:*) echo "::error::win_signer が不正（${signer}）"; exit 1 ;;
            *) p=none ;;
          esac
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "Windows の署名の経路: $p（${EVENT}:${MODE}:${signer}）"

      - name: Get version from package.json
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      # 実行可否の判定（m6-t12 §2.2 / D6 + #104 exact SHA）。version 取得後に置くのが要点
      # （prerelease 判定と expected_version 照合に version が必要）。判定ロジックは smoke（AC3）と同一実装
      - name: Guard build mode
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ steps.ver.outputs.version }}
          EXPECTED_EDITOR_SHA: ${{ inputs.expected_editor_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          WIN_SIGNER: ${{ inputs.win_signer }}
        run: node scripts/m6-t12/check-release-guard.mjs

      # oct26-m12-t5a（HR-26/4）: 新ビューア出力の鮮度ガード。check-release-guard.mjs の直後に
      # 置くことで、full ビルド・未公開版の全ビルド経路（push / dispatch を問わない）が
      # 旧ビューア同梱で止まる（H-M12-5' (a)）。enforce/warn はスクリプトが規則表で決める
      #（workflow 入力で弱められない）。MODE は規則表（mode=full → enforce）にだけ渡す。
      # prepare は依存導入（pnpm install は後続ジョブ）前なので node_modules が無い。スクリプトが
      # それを検知し、依存なし分岐では同梱ビューア public/preview の中身だけを早期ガードし、
      # 版（package.json / pnpm-lock.yaml）は整合性の確認にだけ使う（新しさを版で判定せず、
      # 「解決版 > 1.0.0」の旧世代拒否は行わない — FIX3）。依存の実体（node_modules）の中身の
      # 判定は、各 build ジョブの pnpm install 直後の完全検査 step で行う。
      - name: Check bundled viewer freshness
        env:
          MODE: ${{ inputs.mode }}
        run: node scripts/m12-t5/check-viewer-freshness.mjs

      # #104: 成果物へ埋め込む build commit SHA の証明（provenance）。checkout を
      # inputs.expected_editor_sha へ固定しているため、git rev-parse HEAD がビルド対象 commit になる。
      # AC-7 は成果物内の build-meta.json.editor_sha == expected_editor_sha を照合する。
      - name: Generate build provenance (build-meta.json)
        run: |
          printf '{"editor_sha":"%s","version":"%s"}\n' "$(git rev-parse HEAD)" "$(jq -r .version package.json)" > build-meta.json
          cat build-meta.json
      - name: Upload build-meta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-meta
          path: build-meta.json
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # macOS ビルド（x64 + arm64 DMG）
  # ─────────────────────────────────────────────
  build-mac:
    needs: prepare
    # platforms で対象を絞る（push は常に全プラットフォーム）
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'mac'
    runs-on: macos-latest
    # 公証は Apple のキュー次第で長引く。既定（360分）のままだと応答が返らないときに
    # 6時間まるごと消費してから cancelled になる（m6-t12 AC7 の初回実走で実測）。
    # ビルド 5分 + 公証（x64/arm64 の2回）に十分な余裕を見つつ、早く失敗させる
    timeout-minutes: 120
    # 公証・eSigner 用 secrets は environment `release`（Required reviewers。m6-t12 §2.4）。
    # Mac 証明書2件（APPLE_CERT_BASE64 / APPLE_CERT_PASSWORD）は push でも署名するため
    # `ci` にも置く（t1・2026-08-21）。`ci` にはこの2件以外を置かない（docs/release-signing.md Part C）
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != '') && 'release' || 'ci' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ビルド時に走る依存ツリーへトークンを渡さない（SR-t12-M-1 の多層防御）
          persist-credentials: false
          # #104: 全 checkout を expected_editor_sha へ固定（push では空のため既定 ref へフォールバック）
          ref: ${{ inputs.expected_editor_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（latest 追従による突然の挙動変化を防ぐ）。
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install

      # oct26-m12-t5a（FIX3）: pnpm install の直後に、依存ありの完全検査（A1〜A5・中身で判定）を
      # 実行する。prepare の依存なし分岐は同梱ビューアの中身しか見られないため、依存の実体
      # （node_modules）の中身で新しさを判定する本 step を各 build ジョブに置き、素通り経路をなくす。
      # enforce/warn はスクリプトが規則表で決める（MODE は mode=full → enforce にだけ渡す）。
      - name: Check bundled viewer freshness (dependencies installed)
        env:
          MODE: ${{ inputs.mode }}
        run: node scripts/m12-t5/check-viewer-freshness.mjs

      # Developer ID 証明書のインポート（push / dispatch とも実行。Mac は常に署名を試みる — t1・2026-08-21）
      # インポート成功時に MAC_SIGN=true を設定 → electron-builder が Hardened Runtime 付き署名を行う
      # Secret 未設定（APPLE_CERT_BASE64 が空）の場合はシェル内でスキップし、無署名の DMG になる
      # ※ secrets コンテキストは if: 条件式では使用不可のため、シェル内で判定する
      # 値はあるが組が壊れている（パスワード誤り・base64 破損）場合、このステップは意図的に失敗する
      # （fail-fast — 無署名で黙って続行しない。発端事故の再生産を防ぐ）。
      # 復旧: environment `ci` / `release` の secrets を再登録し、失敗した run を `gh run rerun`
      - name: Import Apple Developer certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-mac
        run: |
          if [ -z "$APPLE_CERT_BASE64" ]; then
            echo "APPLE_CERT_BASE64 が未設定のため証明書インポートをスキップします。"
            exit 0
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          echo "MAC_SIGN=true" >> $GITHUB_ENV

      # 公証環境変数のセット（mode=full のみ）
      # ※ 空文字を env: に渡すと electron-builder が誤動作するため $GITHUB_ENV 経由で設定
      # mode=verify では APPLE_ID を渡さない。notarize.cjs は APPLE_ID 不在でスキップする
      # 既存経路を持つため（scripts/notarize/notarize.cjs:14）、署名済み・未公証の DMG が
      # そのまま得られる。Apple の公証キューが滞留したとき（m6-t12 AC7 で 7 時間超の
      # In Progress を実測）に、動作確認だけ先へ進めるための経路でもある
      - name: Set macOS notarization environment
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        shell: bash
        env:
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_APPLE_ID" ]; then
            echo "APPLE_ID=$_APPLE_ID" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=$_APPLE_APP_SPECIFIC_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID" >> $GITHUB_ENV
          fi

      - name: Build macOS
        run: pnpm run dist:mac

      # 自動更新の更新情報に動作環境の下限を足す。electron-updater は os.release()（Darwin の版）と比べるので
      # macOS 13 = Darwin 22.0.0。electron-builder は latest-mac.yml に書かないため後処理で足す（Upload の前）
      - name: Set minimum system version in latest-mac.yml
        run: node scripts/release/set-mac-minimum-system-version.mjs "release/${{ env.VERSION }}/latest-mac.yml" 22.0.0

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-artifacts
          path: |
            release/${{ env.VERSION }}/*.dmg
            release/${{ env.VERSION }}/*.dmg.blockmap
            release/${{ env.VERSION }}/*.zip
            release/${{ env.VERSION }}/*.zip.blockmap
            release/${{ env.VERSION }}/latest-mac.yml

  # ─────────────────────────────────────────────
  # Windows ビルド（x64 + arm64 NSIS インストーラ）
  # ─────────────────────────────────────────────
  build-win:
    needs: prepare
    # platforms で対象を絞る（push は常に全プラットフォーム）
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'win'
    runs-on: windows-latest
    # 実測 4分台のビルドを mode=full では 2 回（課金前の予行 + 署名本番）行い、eSigner の応答待ち
    # （初回・依存更新時は最大 28 署名）も見込む。早期失敗のため上限は残す
    timeout-minutes: 90
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != '') && 'release' || 'ci' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    outputs:
      # 新しく署名してキャッシュへ足す候補の数（publish-win-sign-cache の起動条件）
      win_sign_cache_new: ${{ steps.cache-outbox.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ビルド時に走る依存ツリーへトークンを渡さない（SR-t12-M-1 の多層防御）
          persist-credentials: false
          # #104: 全 checkout を expected_editor_sha へ固定（push では空のため既定 ref へフォールバック）
          ref: ${{ inputs.expected_editor_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（latest 追従による突然の挙動変化を防ぐ）。
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install

      # oct26-m12-t5a（FIX3）: pnpm install の直後に、依存ありの完全検査（A1〜A5・中身で判定）を
      # 実行する。prepare の依存なし分岐は同梱ビューアの中身しか見られないため、依存の実体
      # （node_modules）の中身で新しさを判定する本 step を各 build ジョブに置き、素通り経路をなくす。
      # enforce/warn はスクリプトが規則表で決める（MODE は mode=full → enforce にだけ渡す）。
      - name: Check bundled viewer freshness (dependencies installed)
        env:
          MODE: ${{ inputs.mode }}
        run: node scripts/m12-t5/check-viewer-freshness.mjs

      # ── Windows の署名（2026-10-03・SAC 起動拒否への対処。仕組みは scripts/win-sign/win-sign.cjs）──
      # electron-builder のファイルごとの署名フックに、配布物に入る全 PE（アプリ本体 exe・DLL・Windows 用 .node・
      # elevate.exe・アンインストーラー・インストーラー・NSIS プラグイン DLL）を渡す。WIN_SIGN_MODE で切り替える:
      #   collect … 署名しない。全ファイルを記録し、署名するはずのものを <SHA-256>.pe で集める（push・verify・
      #             Artifact Signing の経路。nov26-m7-t2）。キャッシュは引かない
      #   record  … 署名しない。記録し、署名済みキャッシュを引いて本番の署名回数の見込みを出す（eSigner の経路の予行）
      #   esigner … SSL.com CodeSignTool で本当に署名する（win_sign_path=esigner のときだけ・課金あり）
      # どの経路でも先に署名なしで 1 回作り、下の検査（コーデック・署名の網羅）を**署名の前に**通す。
      # Artifact Signing の経路は、集めたものを署名専用ジョブ（sign-win-payload）へ渡し、pack-win-1 → … → finalize-win が
      # 署名済みに差し替えて作り直す。eSigner の経路は、ここで esigner でもう一度作る（同じ dist/ から electron-builder だけを再実行）
      - name: Build Windows
        env:
          WIN_SIGN_MODE: ${{ needs.prepare.outputs.win_sign_path == 'esigner' && 'record' || 'collect' }}
          WIN_SIGN_WORK_DIR: release/win-sign/rehearsal
          WIN_SIGN_RECORD_FILE: release/win-sign/record-rehearsal.jsonl
          WIN_SIGN_COLLECT_DIR: release/win-sign/collect
          # 署名済みキャッシュ（eSigner の署名）は eSigner の経路だけが引く（C-4。collect はコードでも引かない）
          WIN_SIGN_CACHE_URL: ${{ needs.prepare.outputs.win_sign_path == 'esigner' && format('https://github.com/{0}/releases/download/win-signed-cache', github.repository) || '' }}
        run: pnpm run dist:win

      # 生成された NSIS ペイロードのコーデックを機械照合する（m19-t13）。
      # nsis7z は解けないコーデックのエントリを**黙って落として完走する**ため、
      # 「ビルド成功 / インストーラ成功 / アプリだけが存在しない」という形で不具合が成立する
      # （v1.0.0-rc2 の arm64 で実際に起きた。MaplatEditor.exe と DLL 8 本が展開されなかった）。
      # ∴ 終了コードやビルド緑では原理的に捕まらず、成果物の中身を直接見るしかない。
      #
      # 位置が要件である: 署名の **前** に置くことで、コーデック不正で落ちたときに
      # eSigner を1回も呼ばない（署名は1回ごとに課金される）。上の Build Windows は署名しない予行
      # （record）であり、課金を伴う署名は下の「Build and sign Windows」で初めて起きる。if: を付けないのは、
      # 課金ゼロの mode=verify と push ビルドでも走らせて日常の回帰の番人にするため。
      # ファイル名は electron-builder.config.cjs の artifactName から決定的（署名ステップと同じ）。
      #
      # アンカー規約（m19-t13 設計 §6.2）: root 側の結線検査は、この検査ステップのスクリプトキー名
      # （または呼び先スクリプトの相対パス）に**最初に一致した行**をアンカーにする。
      # ∴ このステップより上のコメントにそれらの文字列を書かないこと（誤アンカーする）。
      - name: Verify Windows payload codec
        run: pnpm run verify:m19-t13:win-payload-codec release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-x64-Setup.exe release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-arm64-Setup.exe

      # 署名の網羅の機械照合（課金の前）: インストーラーを展開し（$PLUGINSDIR/app-*.7z・アンインストーラーの中まで）、
      # 中身で判定した全 PE が署名フックに渡った（または Microsoft 署名済み）ことを記録と SHA-256 で照らし合わせる。
      # 漏れが 1 つでもあれば落ち、本番の署名へ進まない。記録の末尾に本番での署名回数の見込みが出る
      - name: Verify Windows signing coverage (rehearsal, no billing)
        run: node scripts/win-sign/verify-win-sign-coverage.mjs --record release/win-sign/record-rehearsal.jsonl --summary release/win-sign/coverage-rehearsal.json release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-x64-Setup.exe release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-arm64-Setup.exe

      # SSL.com CodeSignTool の取得（mode=full のみ）。公式リリースの Windows 版 zip を版とハッシュで固定する。
      # 版は esigner-codesign action v1.3.2（従来 Setup.exe の署名に使っていたもの）が内部で取得する v1.3.0 と同じ。
      # zip は Java（jdk-11.0.2）を同梱するため、Java の導入 step は要らない。
      # 設定ファイルは action v1.3.2 が PROD 環境で書き込む内容と同じ（公開値であり secret ではない）
      - name: Set up SSL.com CodeSignTool
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        shell: pwsh
        env:
          CODESIGNTOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip
          CODESIGNTOOL_SHA256: e22094505decbe622afe5b0c27abc618ed2ba179bd94f3450490352399d5ef2a
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool-v1.3.0-windows.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:CODESIGNTOOL_SHA256) { throw "CodeSignTool の SHA-256 が一致しません: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $props = @(
            'CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8',
            'OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token',
            'CSC_API_ENDPOINT=https://cs.ssl.com',
            'TSA_URL=http://ts.ssl.com',
            'TSA_LEGACY_URL=http://ts.ssl.com/legacy'
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $dir 'conf/code_sign_tool.properties') -Value $props -NoNewline -Encoding utf8NoBOM
          if (-not (Test-Path (Join-Path $dir 'jdk-11.0.2/bin/java.exe'))) { throw 'CodeSignTool 同梱の Java が見つかりません' }
          "CODE_SIGN_TOOL_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 本番の署名ビルド（mode=full のみ・課金あり）。予行と同じ dist/ から electron-builder だけを再実行し、
      # フックが CodeSignTool で 1 ファイルずつ署名する。キャッシュに当たったものは署名せずに差し替える
      # （予行で取得・検証済みの asset を WIN_SIGN_CACHE_DIR で再利用する）。インストーラーの署名は
      # electron-builder が blockmap と latest.yml を計算する**前**に行われるため、両者は署名済みの
      # バイナリから計算される（app-builder-lib NsisTarget.js: signIf → createBlockmap）
      - name: Build and sign Windows (SSL.com eSigner)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        env:
          WIN_SIGN_MODE: esigner
          WIN_SIGN_WORK_DIR: release/win-sign/esigner
          WIN_SIGN_RECORD_FILE: release/win-sign/record-esigner.jsonl
          WIN_SIGN_CACHE_DIR: release/win-sign/rehearsal/cache-fetched
          WIN_SIGN_CACHE_URL: https://github.com/${{ github.repository }}/releases/download/win-signed-cache
          WIN_SIGN_CACHE_OUTBOX: release/win-sign/cache-outbox
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never --win

      # 署名本番の成果物の検査（eSigner の経路のみ）: 全 PE の Authenticode が Valid で、署名者が
      # scripts/win-sign/signer-identity.json の esigner（または Microsoft）であること。コーデックも署名後の成果物で照合し直す
      - name: Verify Windows signatures (Authenticode)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        run: node scripts/win-sign/verify-win-sign-coverage.mjs --authenticode --signer esigner --summary release/win-sign/coverage-esigner.json release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-x64-Setup.exe release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-arm64-Setup.exe

      - name: Verify Windows payload codec (signed build)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        run: pnpm run verify:m19-t13:win-payload-codec release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-x64-Setup.exe release/${{ env.VERSION }}/MaplatEditor-Windows-${{ env.VERSION }}-arm64-Setup.exe

      # auto-update メタデータの再計算（mode=full のみ）。署名をフックへ移したため electron-builder が
      # 署名済みバイナリから latest.yml と blockmap を作っており、本来は不要（2026-10-03 に record ビルドで
      # 実測: 再計算しても latest.yml はバイト一致・blockmap は展開後の中身が一致し gzip ヘッダーの OS 欄だけ違う）。
      # 冪等な安全網として残す（m6-t12 §2.3・AC5）
      - name: Update auto-update metadata after signing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        run: node scripts/m6-t12/resign-update-metadata.mjs release/${{ env.VERSION }}

      # ── Artifact Signing の経路（nov26-m7-t2）: 署名専用ジョブへ渡すものを並べる ──
      # 記録の would-sign のうち payload（*-unpacked の中・NSIS プラグイン・elevate.exe）を <SHA-256>.pe で並べる。
      # アンインストーラーとインストーラーは後の段（pack-win-1・pack-win-2）で作り直して並べる
      - name: Collect the payload to sign (Artifact Signing)
        if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
        run: node scripts/win-sign/collect-sign-set.mjs --phase payload --record release/win-sign/record-rehearsal.jsonl --collect-dir release/win-sign/collect --out win-sign-in --manifest release/win-sign/manifest-payload.json

      # 署名前の unpacked（x64・arm64）を pack のジョブへ渡す。latest.yml は形の雛形（--prepackaged は arch ごとに
      # 走るので、1 回で両 arch を作ったここの latest.yml が現行の配布物と同じ形）
      - name: Pack stage 1 for the signing jobs (Artifact Signing)
        if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
        shell: bash
        run: tar -cf release/win-stage1.tar -C "release/${VERSION}" win-unpacked win-arm64-unpacked

      - name: Upload the payload to sign (Artifact Signing)
        if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-sign-in-payload
          path: win-sign-in
          retention-days: 1
          if-no-files-found: error

      - name: Upload stage 1 (Artifact Signing)
        if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-stage1
          path: release/win-stage1.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload stage 1 metadata (Artifact Signing)
        if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-stage1-meta
          path: |
            release/${{ env.VERSION }}/latest.yml
            release/win-sign/manifest-payload.json
          retention-days: 1
          if-no-files-found: error

      # Artifact Signing の経路では finalize-win が上げる（同名 artifact を二重に上げない）
      - name: Upload Windows artifacts
        if: needs.prepare.outputs.win_sign_path != 'artifact-signing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-artifacts
          path: |
            release/${{ env.VERSION }}/*.exe
            release/${{ env.VERSION }}/*.exe.blockmap
            release/${{ env.VERSION }}/latest.yml

      # 署名の記録と照合結果（全モード・失敗時も）。何を署名し、何がキャッシュに当たったかの監査用
      - name: Upload Windows signing records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-sign-records
          path: |
            release/win-sign/*.jsonl
            release/win-sign/*.json
          if-no-files-found: ignore

      # 新しく署名したキャッシュ対象（DLL・elevate.exe・.node・NSIS プラグイン）を、書き込み権限のある
      # publish-win-sign-cache ジョブへ artifact で渡す。このジョブに contents: write を与えない（SR-t12-M-1）
      # always(): 署名の途中でビルドが失敗しても、それまでに署名できたファイルは保管する（課金の取り直しを防ぐ。
      # 1.1.0-rc.2 の run 37125230712 で .node の署名失敗により 15 本の署名済みファイルを失った）
      - name: Count signed-file cache candidates
        id: cache-outbox
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner'
        shell: bash
        run: |
          n=0
          if [ -d release/win-sign/cache-outbox ]; then n=$(find release/win-sign/cache-outbox -type f -name '*.signed' | wc -l | tr -d ' '); fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "キャッシュへ足す候補: $n 件"

      - name: Upload signed-file cache candidates
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.prepare.outputs.win_sign_path == 'esigner' && steps.cache-outbox.outputs.count != '0' && steps.cache-outbox.outputs.count != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-sign-cache-outbox
          path: release/win-sign/cache-outbox/*.signed
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 署名済みファイルのキャッシュを Release `win-signed-cache` の asset へ足す（mode=full のみ）
  #
  # 書き込み（asset の追加）には contents: write が要る。build-win に write を与えると、ビルド時に走る
  # 依存ツリーの汚染がリポジトリ書き込みに直結する（SR-t12-M-1）ため、書き込みはこの専用ジョブに限る。
  # このジョブは checkout も依存の導入もせず、リポジトリのコードを 1 行も実行しない（gh CLI だけ）。
  # 取り込む側（scripts/win-sign/win-sign.cjs）は、asset を使う前に「署名を除いた中身が署名前ファイルと一致」
  # 「Authenticode が Valid」「署名者が signer-identity.json の esigner」を確かめるので、ここで改ざんされても取り込まれない。
  # Release は prerelease として作り、配布物ではないことを本文に書く（アプリの自動更新（electron-updater）は `allowPrerelease: false` で prerelease を見ない（#141））
  # ─────────────────────────────────────────────
  publish-win-sign-cache:
    needs: [prepare, build-win]
    # build-win が失敗しても、署名できた分は保管する（取り込み側が中身と署名を検証するので安全）
    # キャッシュを書くのは eSigner の退路だけ（C-4: Artifact Signing の経路はキャッシュを読まない・書かない）。
    # always() を持つので prepare の成功も要る（nov26-m7-t4）
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.build-win.outputs.win_sign_cache_new != '0' && needs.build-win.outputs.win_sign_cache_new != '' && needs.prepare.result == 'success' && needs.prepare.outputs.win_sign_path == 'esigner'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_TAG: win-signed-cache
    steps:
      - name: Download signed-file cache candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-sign-cache-outbox
          path: outbox

      # 上げる前の検査（nov26-m7-t4・#140 L-2）。公式の Release から配られうるファイルを、名前（win-sign.cjs の
      # assetName の形）・種類（通常のファイル）・大きさ・件数・中身の形（PE の MZ）で絞る。1 つでも外れたら
      # この step が落ち、次の upload は走らない（何も上げない）。リポジトリのコードは実行しない（shell と coreutils だけ）。
      # 検査の振る舞いは scripts/nov26-m7-t4-cache-publish-guard-smoke.mjs がこの run: を抜き出して実行して確かめる
      - name: Check cache candidates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C   # 正規表現の範囲（[0-9a-f]）を文字コードの順で解釈させる
          MAX_FILES=64; MAX_BYTES=67108864   # 1 実行あたりの件数の上限・1 ファイル 64 MiB
          files=(outbox/*)
          [ "${#files[@]}" -ge 1 ] || { echo "::error::候補が 0 件"; exit 1; }
          [ "${#files[@]}" -le "$MAX_FILES" ] || { echo "::error::候補が ${#files[@]} 件（上限 $MAX_FILES）"; exit 1; }
          re='^[0-9a-f]{64}--[A-Za-z0-9._-]{1,200}\.signed$'
          for f in "${files[@]}"; do
            name=$(basename -- "$f")
            [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::通常のファイルでない: $name"; exit 1; }
            [[ "$name" =~ $re ]] || { echo "::error::名前が規則に合わない: $name"; exit 1; }
            case "$name" in *..*) echo "::error::名前に .. を含む: $name"; exit 1;; esac
            size=$(stat -c %s -- "$f")
            [ "$size" -ge 64 ] && [ "$size" -le "$MAX_BYTES" ] || { echo "::error::大きさが範囲外（$size）: $name"; exit 1; }
            [ "$(head -c 2 -- "$f" | od -An -c | tr -d ' \n')" = "MZ" ] || { echo "::error::PE でない: $name"; exit 1; }
          done
          echo "検査を通った候補: ${#files[@]} 件"

      - name: Publish to the cache release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$CACHE_TAG" >/dev/null 2>&1; then
            gh release create "$CACHE_TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Windows 署名済みファイルのキャッシュ（配布物ではありません）" \
              --notes "build.yml（mode=full）が Windows 配布物の署名に使い回す、署名済みの DLL・elevate.exe・.node・NSIS プラグインの保管場所です。アプリの配布物ではありません。asset 名は <署名前ファイルの SHA-256>--<ファイル名>.signed。取り込み時に中身と署名を検証します（scripts/win-sign/win-sign.cjs）。"
          fi
          existing=$(gh release view "$CACHE_TAG" --json assets --jq '.assets[].name')
          # 上の検査と同じ集合を上げる（検査を通った後なので全件が .signed）
          for f in outbox/*; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "既にある: $name"
            else
              gh release upload "$CACHE_TAG" "$f"
              echo "追加: $name"
            fi
          done

  # ─────────────────────────────────────────────
  # Artifact Signing の経路（nov26-m7-t2・C-8）: 署名専用ジョブ 3 つと、その間の pack（依存を入れるが id-token を持たない）
  #   build-win（payload を集める）→ sign-win-payload → pack-win-1（アンインストーラーを集める）→ sign-win-uninstaller
  #   → pack-win-2（署名済みのアンインストーラーに差し替えてインストーラーを集める）→ sign-win-installer
  #   → finalize-win（署名済みの Setup.exe・latest.yml・blockmap・網羅検査）→ verify-win-install（入れて起動して消す）
  # 署名の受け渡しの名前は <SHA-256>.pe（.exe の名前で並べると成果物の検査器 oct26-m4-t2 (d) に当たる）
  # ─────────────────────────────────────────────
  # 署名専用ジョブ（payload: unpacked の PE・NSIS プラグイン・elevate.exe）。3 つの署名専用ジョブは step の列が完全に同じで、違いは下の env: のリテラル 3 つだけ
  # （smoke が step の一致を断言する）。OIDC の要求口（id-token: write）はジョブの間ずっと開いているので、リポジトリの
  # コード・依存を一切実行しない（checkout・pnpm・setup-node を持たない）。規則の正本は scripts/win-sign/signing-job-rules.mjs
  sign-win-payload:
    needs: [prepare, build-win]
    if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    # contents: read も持たない（同じ run の artifact の受け渡しは runtime のトークンで行われ GITHUB_TOKEN を使わない。nov26-m7-t3）
    permissions:
      id-token: write
    env:
      IN_ARTIFACT: win-sign-in-payload
      OUT_ARTIFACT: win-signed-payload
      MAX_FILES: '48'
    steps:
      - name: Download the files to sign
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.IN_ARTIFACT }}
          path: sign-in

      # 入力の検査（MIN-3）: 全項目を再帰で数え、ディレクトリ・リンクが 1 つでもあれば落とす。全項目が直下のファイルで
      # 名前が <SHA-256>.pe・件数が 1 以上 MAX_FILES 以下・中身の SHA-256 が名前と一致・512 MiB 以下・先頭が MZ。
      # 署名の step は -Filter *.pe で直下だけを見るので「検査した集合＝署名する集合」になる。ファイルは読むだけで実行しない
      - name: Check the input
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath sign-in).Path
          $items = @(Get-ChildItem -LiteralPath sign-in -Recurse -Force)
          $max = [int]$env:MAX_FILES
          if ($items.Count -lt 1 -or $items.Count -gt $max) { throw "入力の件数が 1 以上 $max 以下でない: $($items.Count)" }
          foreach ($f in $items) {
            if ($f.Attributes -band ([IO.FileAttributes]::Directory -bor [IO.FileAttributes]::ReparsePoint)) { throw "ディレクトリかリンクがある: $($f.FullName)" }
            if ($f.DirectoryName -ne $root) { throw "直下のファイルでない: $($f.FullName)" }
            if ($f.Name -cnotmatch '^[0-9a-f]{64}\.pe$') { throw "名前が <SHA-256>.pe でない: $($f.Name)" }
            if ($f.Length -gt 512MB) { throw "大きすぎる: $($f.Name) $($f.Length) バイト" }
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            if ("$sha.pe" -cne $f.Name) { throw "中身の SHA-256 が名前と違う: $($f.Name) / $sha" }
            $fs = [IO.File]::OpenRead($f.FullName)
            try {
              $head = New-Object byte[] 2
              if ($fs.Read($head, 0, 2) -ne 2) { throw "先頭 2 バイトが読めない: $($f.Name)" }
            } finally { $fs.Dispose() }
            if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "先頭が MZ でない（PE でない）: $($f.Name)" }
          }
          "入力: $($items.Count) 本（上限 $max）"

      # 署名ツールの取得: NuGet から版と SHA-256 で固定する（nov26-m7-t1 の probe-sign と同じ値）
      - name: Set up SignTool and the Artifact Signing dlib
        shell: pwsh
        env:
          BUILDTOOLS_ID: Microsoft.Windows.SDK.BuildTools
          BUILDTOOLS_VERSION: 10.0.28000.2705
          BUILDTOOLS_SHA256: 8bfdfb6ca2633f531cf80b5fa22512ba61a394d7988f0970db83baadc67929ed
          ARTIFACTSIGNING_ID: Microsoft.ArtifactSigning.Client
          ARTIFACTSIGNING_VERSION: 1.0.128
          ARTIFACTSIGNING_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'signing-tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          function Get-PinnedPackage([string]$id, [string]$ver, [string]$sha) {
            $zip = Join-Path $tools "$id.$ver.zip"
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$id/$ver" -OutFile $zip
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
            if ($actual -ne $sha) { throw "$id $ver の SHA-256 が一致しません: $actual" }
            $dir = Join-Path $tools $id
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            return $dir
          }
          $bt = Get-PinnedPackage $env:BUILDTOOLS_ID $env:BUILDTOOLS_VERSION $env:BUILDTOOLS_SHA256
          $as = Get-PinnedPackage $env:ARTIFACTSIGNING_ID $env:ARTIFACTSIGNING_VERSION $env:ARTIFACTSIGNING_SHA256
          $signtool = @(Get-ChildItem -LiteralPath $bt -Recurse -Filter signtool.exe | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($signtool.Count -ne 1) { throw "x64 の signtool.exe がちょうど 1 つでない: $($signtool.Count)" }
          $dlib = @(Get-ChildItem -LiteralPath $as -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($dlib.Count -ne 1) { throw "x64 の Azure.CodeSigning.Dlib.dll がちょうど 1 つでない: $($dlib.Count)" }
          "SIGNTOOL=$($signtool[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DLIB=$($dlib[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check .NET 8 Runtime
        shell: pwsh
        run: |
          $runtimes = @(dotnet --list-runtimes)
          $runtimes
          if (-not ($runtimes | Where-Object { $_ -like 'Microsoft.NETCore.App 8.*' })) { throw '.NET 8 Runtime（Microsoft.NETCore.App 8.x）が無い' }

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 値はこの run: の中のリテラルだけ（式・前の step の出力・artifact から作らない）。
      # ExcludeCredentials は AzureCliCredential（azure/login が作る）だけを残す（H-B1 で AzureCliCredential だけが使われたと確認）
      - name: Write metadata.json
        shell: pwsh
        run: |
          $meta = [ordered]@{
            Endpoint               = 'https://jpe.codesigning.azure.net'
            CodeSigningAccountName = 'nayutasigning'
            CertificateProfileName = 'maplateditor'
            CorrelationId          = "$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          }
          $meta | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath metadata.json -Encoding utf8NoBOM
          Get-Content -LiteralPath metadata.json

      - name: Sign
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -LiteralPath sign-in -Filter *.pe).FullName)
          & $env:SIGNTOOL sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:DLIB /dmdf metadata.json @files
          if ($LASTEXITCODE -ne 0) { throw "SignTool の署名が失敗した: exit $LASTEXITCODE" }

      # 衛生（OIDC の要求口の対策ではない）
      - name: Azure logout
        if: always()
        shell: pwsh
        run: |
          az logout
          az account clear
          exit 0

      # 署名の記録: 各ファイルの { in: 署名前の SHA-256（名前）, out: 署名後の SHA-256, status }。Valid でないものが
      # 1 つでもあれば落とす。署名者の照合は後段（pack-win-*・finalize-win。signer-identity.json を読めるジョブ）が行う
      - name: Record the signatures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path sign-out -Force | Out-Null
          $rec = @()
          $bad = @()
          foreach ($f in @(Get-ChildItem -LiteralPath sign-in -Filter *.pe)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $out = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            $rec += [ordered]@{
              in = $f.BaseName; out = $out; status = [string]$sig.Status
              subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }
            }
            if ([string]$sig.Status -ne 'Valid') { $bad += "$($f.Name): $($sig.Status)" }
            Copy-Item -LiteralPath $f.FullName -Destination (Join-Path sign-out $f.Name)
          }
          ConvertTo-Json -InputObject @($rec) -Depth 3 | Set-Content -LiteralPath (Join-Path sign-out 'signing-record.json') -Encoding utf8NoBOM
          # job summary にも表で書く（artifact は 1 日で消えるが、summary は run の保持期間残る＝後から監査できる。nov26-m7-t3）
          $md = @("### 署名の記録（$env:GITHUB_JOB・$($rec.Count) 本）", '', '| in (署名前 SHA-256) | out (署名後 SHA-256) | status |', '|---|---|---|')
          foreach ($r in $rec) { $md += "| $($r['in']) | $($r['out']) | $($r['status']) |" }
          ($md -join "`n") + "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($bad.Count -gt 0) { throw "Valid でない: $($bad -join ', ')" }
          "署名 $($rec.Count) 本: すべて Valid"

      - name: Upload the signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.OUT_ARTIFACT }}
          path: sign-out
          retention-days: 1
          if-no-files-found: error

  pack-win-1:
    needs: [prepare, build-win, sign-win-payload]
    if: needs.prepare.outputs.win_sign_path == 'artifact-signing'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      WIN_SIGN_WORK_DIR: release/win-sign/pack1
      WIN_SIGN_RECORD_FILE: release/win-sign/record-pack1.jsonl
      WIN_SIGN_COLLECT_DIR: release/win-sign/collect-pack1
      WIN_SIGN_SIGNED_DIR: release/win-sign/signed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_editor_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download stage 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-stage1
          path: release

      - name: Download stage 1 metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-stage1-meta
          path: release

      - name: Download the signed payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-signed-payload
          path: release/win-sign/signed-payload

      - name: Restore the unpacked apps
        shell: bash
        run: tar -xf release/win-stage1.tar -C "release/${VERSION}"

      # 署名済みの payload を照合（署名と TimeDateStamp を除いた中身・Authenticode・artifact-signing の署名者）してから
      # unpacked へ書き戻し、NSIS プラグインと elevate.exe は WIN_SIGN_SIGNED_DIR に置く
      - name: Apply the signed payload
        run: node scripts/win-sign/apply-signed.mjs --phase payload --manifest release/win-sign/manifest-payload.json --signed release/win-sign/signed-payload --signer artifact-signing --release-dir release/${{ env.VERSION }} --signed-dir release/win-sign/signed

      # 準備の step（MAJ-1）: --prepackaged では beforePack が呼ばれないので、electron-builder の前に NSIS ツールセットを
      # 用意する（署名済みのプラグインに差し替え、ELECTRON_BUILDER_NSIS_DIR・RESOURCES_DIR を $GITHUB_ENV へ）
      - name: Prepare the NSIS toolset
        env:
          WIN_SIGN_MODE: collect
        run: node scripts/win-sign/prepare-nsis-toolset.mjs

      - name: Pack the Windows installer (x64)
        env:
          WIN_SIGN_MODE: collect
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never --win nsis --x64 --prepackaged release/${{ env.VERSION }}/win-unpacked

      - name: Pack the Windows installer (arm64)
        env:
          WIN_SIGN_MODE: collect
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never --win nsis --arm64 --prepackaged release/${{ env.VERSION }}/win-arm64-unpacked

      # 前の phase（payload）の would-sign が残っていたら赤（プラグイン・elevate.exe が差し替えられていない）
      - name: Collect the uninstallers to sign
        run: node scripts/win-sign/collect-sign-set.mjs --phase uninstaller --record release/win-sign/record-pack1.jsonl --collect-dir release/win-sign/collect-pack1 --out win-sign-in --manifest release/win-sign/manifest-uninstaller.json

      - name: Upload the uninstallers to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-sign-in-uninstaller
          path: win-sign-in
          retention-days: 1
          if-no-files-found: error

      - name: Upload the pack-win-1 record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-pack1-record
          path: |
            release/win-sign/record-pack1.jsonl
            release/win-sign/manifest-uninstaller.json
          retention-days: 1
          if-no-files-found: ignore

  # 署名専用ジョブ（アンインストーラー）。3 つの署名専用ジョブは step の列が完全に同じで、違いは下の env: のリテラル 3 つだけ
