# nov26-m7-t1（#130 の前段）: Azure Artifact Signing の疎通。
#
# master の上で 1 回だけ署名して、Azure 側の設定（H-A）が使えることを確かめ、署名した実物から
# Subject・発行者・チェーン・EKU を読む（t2 の signer-identity.json と t5 の publisherName の入力）。
# 配布物は作らない。上げるのは probe-result.json（実測の JSON）だけで、署名済みの PE は上げない。
#
# 構成（署名専用ジョブの規則の正本は scripts/win-sign/signing-job-rules.mjs・静的検査は
# scripts/nov26-m7-t1-artifact-signing-probe-smoke.mjs）:
#   probe-build … 未署名の MaplatEditor.exe を作る。environment・id-token・secrets を持たない
#   probe-sign  … 署名専用。environment release（master だけ・承認つき）と id-token: write を持つ。
#                 OIDC の要求口はジョブの間ずっと使えるため、リポジトリのコード・依存を一切実行しない
#                 （checkout・pnpm・setup-node を持たない）。外部 action は actions/* も含めて SHA で固定し、
#                 署名ツールは NuGet から版と SHA-256 で固定して取る。入力の PE は実行しない
#
# 起動は人間が workflow_dispatch で行い、probe-sign の承認も人間が行う（H-B1）。
# 承認スクリプトは run-name の表示名で自分の起動であることを照合する ∴ run-name の書式を変えない
name: Artifact Signing probe
run-name: artifact-signing-probe sha=${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # (A) 未署名の PE を作る（特権なし）
  # ─────────────────────────────────────────────
  probe-build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm 11 は allowBuilds・overrides を pnpm-workspace.yaml からしか読まない（build.yml と同じ）。
      # 書式は build.yml・test.yml と同じ cp に揃える（outer の verify:m1-t2 AC2b がこの形で数える。
      # pwsh の cp は Copy-Item の別名）
      - name: Apply CI-only pnpm config
        shell: pwsh
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # WIN_SIGN_MODE を設定しない（= off）。署名フックは登録されず、未署名の win-unpacked ができる
      - name: Package (unsigned, x64, dir)
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never --win --x64 --dir

      - name: Collect the unsigned PE
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $exe = "release/$version/win-unpacked/MaplatEditor.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Get-ChildItem -LiteralPath release -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
            throw "未署名の PE が無い: $exe"
          }
          New-Item -ItemType Directory -Path probe-in -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination probe-in/MaplatEditor.exe
          Get-FileHash -Algorithm SHA256 -LiteralPath probe-in/MaplatEditor.exe | Format-List

      - name: Upload the unsigned PE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-unsigned
          path: probe-in/MaplatEditor.exe
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # (B) 署名専用ジョブ（id-token: write・environment release）
  # ─────────────────────────────────────────────
  probe-sign:
    needs: probe-build
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the unsigned PE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: probe-unsigned
          path: probe-in

      # 入力の検査: MaplatEditor.exe 1 本だけ・400 MiB 以下・先頭が MZ。ファイルは読むだけで実行しない
      - name: Check the input
        shell: pwsh
        run: |
          $items = @(Get-ChildItem -LiteralPath probe-in -Force -Recurse)
          if ($items.Count -ne 1) { throw "probe-in の中身が 1 つでない: $($items.Count)" }
          $f = $items[0]
          if ($f.PSIsContainer -or $f.Name -ne 'MaplatEditor.exe') { throw "probe-in の中身が MaplatEditor.exe でない: $($f.Name)" }
          if ($f.Length -gt 400MB) { throw "大きすぎる: $($f.Length) バイト" }
          $fs = [IO.File]::OpenRead($f.FullName)
          try {
            $head = New-Object byte[] 2
            if ($fs.Read($head, 0, 2) -ne 2) { throw '先頭 2 バイトが読めない' }
          } finally { $fs.Dispose() }
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw '先頭が MZ でない（PE でない）' }
          # 拡張子の実測用の複写（t2 は受け渡しのファイル名を <SHA-256>.pe にする予定）
          Copy-Item -LiteralPath $f.FullName -Destination probe-in/ext-check.pe
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
          "UNSIGNED_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "入力: $($f.Name) $($f.Length) バイト sha256=$sha"

      # 署名ツールの取得: NuGet から版と SHA-256 で固定する（build.yml の CodeSignTool と同じ形）。
      # BuildTools は 10.0.2261.755 以上（Microsoft Learn）。版は 2026-10-12 時点で公開から 2 週間以上経った最新の安定版
      - name: Set up SignTool and the Artifact Signing dlib
        shell: pwsh
        env:
          BUILDTOOLS_ID: Microsoft.Windows.SDK.BuildTools
          BUILDTOOLS_VERSION: 10.0.28000.2705
          BUILDTOOLS_SHA256: 8bfdfb6ca2633f531cf80b5fa22512ba61a394d7988f0970db83baadc67929ed
          ARTIFACTSIGNING_ID: Microsoft.ArtifactSigning.Client
          ARTIFACTSIGNING_VERSION: 1.0.128
          ARTIFACTSIGNING_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'signing-tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          function Get-PinnedPackage([string]$id, [string]$ver, [string]$sha) {
            $zip = Join-Path $tools "$id.$ver.zip"
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$id/$ver" -OutFile $zip
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
            if ($actual -ne $sha) { throw "$id $ver の SHA-256 が一致しません: $actual" }
            $dir = Join-Path $tools $id
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            return $dir
          }
          $bt = Get-PinnedPackage $env:BUILDTOOLS_ID $env:BUILDTOOLS_VERSION $env:BUILDTOOLS_SHA256
          $as = Get-PinnedPackage $env:ARTIFACTSIGNING_ID $env:ARTIFACTSIGNING_VERSION $env:ARTIFACTSIGNING_SHA256
          $signtool = @(Get-ChildItem -LiteralPath $bt -Recurse -Filter signtool.exe | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($signtool.Count -ne 1) { throw "x64 の signtool.exe がちょうど 1 つでない: $($signtool.Count)" }
          $dlib = @(Get-ChildItem -LiteralPath $as -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($dlib.Count -ne 1) { throw "x64 の Azure.CodeSigning.Dlib.dll がちょうど 1 つでない: $($dlib.Count)" }
          "SIGNTOOL=$($signtool[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DLIB=$($dlib[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "signtool: $($signtool[0].FullName)"
          "dlib: $($dlib[0].FullName)"

      # dlib は .NET 8 Runtime を要る（runtimeconfig は net8.0・rollForward Major）。
      # windows-2025 の image は Microsoft.NETCore.App 8.0.x を持つ（2026-10-12 に runner-images の Readme で確認）
      - name: Check .NET 8 Runtime
        shell: pwsh
        run: |
          $runtimes = @(dotnet --list-runtimes)
          $runtimes
          if (-not ($runtimes | Where-Object { $_ -like 'Microsoft.NETCore.App 8.*' })) { throw '.NET 8 Runtime（Microsoft.NETCore.App 8.x）が無い' }

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 値はこの run: の中のリテラルだけ（式・前の step の出力・artifact から作らない）。
      # ExcludeCredentials は AzureCliCredential（azure/login が作る）だけを残し、別経路の認証を塞ぐ。
      # CertificateProfileName は H-A の既定 maplateditor（2026-10-12 に人間が既定どおりと報告）
      - name: Write metadata.json
        shell: pwsh
        run: |
          $meta = [ordered]@{
            Endpoint               = 'https://jpe.codesigning.azure.net'
            CodeSigningAccountName = 'nayutasigning'
            CertificateProfileName = 'maplateditor'
            CorrelationId          = "$env:GITHUB_RUN_ID"
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          }
          $meta | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath metadata.json -Encoding utf8NoBOM
          Get-Content -LiteralPath metadata.json

      - name: Sign
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /v /debug /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:DLIB /dmdf metadata.json probe-in\MaplatEditor.exe
          if ($LASTEXITCODE -ne 0) { throw "SignTool の署名が失敗した: exit $LASTEXITCODE" }

      # 拡張子の実測（t2 の入力）: .pe の名前でも SignTool が中身で PE と判定して署名できるか。
      # この署名の失敗ではジョブを落とさず、終了コードと Status を記録する
      - name: Sign with the .pe extension (measurement)
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:DLIB /dmdf metadata.json probe-in\ext-check.pe
          $code = $LASTEXITCODE
          $status = (Get-AuthenticodeSignature -LiteralPath probe-in\ext-check.pe).Status.ToString()
          [ordered]@{ fileName = 'ext-check.pe'; exitCode = $code; status = $status } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ext-check.json') -Encoding utf8NoBOM
          "ext-check: exit=$code status=$status"
          exit 0

      # 衛生（OIDC の要求口の対策ではない）
      - name: Azure logout
        if: always()
        shell: pwsh
        run: |
          az logout
          az account clear
          exit 0

      - name: Write probe-result.json
        shell: pwsh
        run: |
          $f = 'probe-in\MaplatEditor.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $f
          $cert = $sig.SignerCertificate
          $signer = $null
          $chain = @()
          $chainBuilt = $null
          $chainStatus = @()
          $eku = @()
          if ($cert) {
            $signer = [ordered]@{
              Subject = $cert.Subject; Issuer = $cert.Issuer; Thumbprint = $cert.Thumbprint
              NotBefore = $cert.NotBefore.ToUniversalTime().ToString('o'); NotAfter = $cert.NotAfter.ToUniversalTime().ToString('o')
              SerialNumber = $cert.SerialNumber
            }
            $x509chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            $chainBuilt = $x509chain.Build($cert)
            $chainStatus = @($x509chain.ChainStatus | ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" })
            $chain = @($x509chain.ChainElements | ForEach-Object {
              [ordered]@{
                Subject = $_.Certificate.Subject; Issuer = $_.Certificate.Issuer; Thumbprint = $_.Certificate.Thumbprint
                NotAfter = $_.Certificate.NotAfter.ToUniversalTime().ToString('o')
              }
            })
            $ekuExt = $cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' }
            if ($ekuExt) {
              $eku = @(([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ekuExt).EnhancedKeyUsages |
                ForEach-Object { $_.Value })
            }
          }
          $verifyOut = @(& $env:SIGNTOOL verify /pa /v $f 2>&1 | ForEach-Object { "$_" })
          $verifyCode = $LASTEXITCODE
          $extCheckPath = Join-Path $env:RUNNER_TEMP 'ext-check.json'
          $extCheck = if (Test-Path -LiteralPath $extCheckPath) { Get-Content -LiteralPath $extCheckPath -Raw | ConvertFrom-Json } else { $null }
          $result = [ordered]@{
            task = 'nov26-m7-t1'
            runId = "$env:GITHUB_RUN_ID"
            sha = "$env:GITHUB_SHA"
            status = $sig.Status.ToString()
            statusMessage = $sig.StatusMessage
            signerCertificate = $signer
            timeStamperSubject = if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { $null }
            chainBuilt = $chainBuilt
            chainStatus = $chainStatus
            chain = $chain
            eku = $eku
            signtoolVerify = [ordered]@{ exitCode = $verifyCode; tail = @($verifyOut | Select-Object -Last 40) }
            sha256 = [ordered]@{
              unsigned = "$env:UNSIGNED_SHA256"
              signed = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
            }
            extCheck = $extCheck
          }
          $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath probe-result.json -Encoding utf8NoBOM
          Get-Content -LiteralPath probe-result.json
          exit 0

      # 署名済みの PE は上げない（JSON だけ）
      - name: Upload probe-result.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-result
          path: probe-result.json
          retention-days: 14
          if-no-files-found: error

      # 判定: Status が Valid・Artifact Signing の EKU（1.3.6.1.4.1.311.97.）がある・signtool verify /pa が 0
      - name: Judge
        shell: pwsh
        run: |
          $r = Get-Content -LiteralPath probe-result.json -Raw | ConvertFrom-Json
          $errors = @()
          if ($r.status -ne 'Valid') { $errors += "Status が Valid でない: $($r.status)" }
          if (-not (@($r.eku) | Where-Object { $_ -like '1.3.6.1.4.1.311.97.*' })) { $errors += 'EKU に 1.3.6.1.4.1.311.97. で始まる OID が無い' }
          if ($r.signtoolVerify.exitCode -ne 0) { $errors += "signtool verify /pa の終了コードが 0 でない: $($r.signtoolVerify.exitCode)" }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }
          "probe: Valid・EKU あり・verify 0"
