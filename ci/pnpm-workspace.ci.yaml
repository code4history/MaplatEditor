# CI 専用の pnpm 設定（m1-t2）
#
# なぜリポジトリ直下の pnpm-workspace.yaml ではなくここに置くか:
#   pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない（package.json の
#   pnpm フィールドも .npmrc も効かないことを実測）。しかし pnpm-workspace.yaml が
#   リポジトリ直下に存在すると、pnpm はそのディレクトリを workspace ルートと判定する
#   （packages: の有無は無関係。実測）。ローカル開発では superproject（Maplats）が
#   workspace ルートであり、リポジトリ内で pnpm run を1回実行しただけで単独 install が
#   走って内部パッケージの symlink が壊れる。
#
#   CI は各リポジトリを単独 clone するため workspace ルートになって困らない。そこで
#   ファイル名を pnpm が読まないものにしてコミットし、CI の install 直前に
#   pnpm-workspace.yaml へコピーする。
#
# 中身の出自: CI と同条件（CI=true・--no-ignore-scripts・単独 clone 相当）で
#   pnpm install を実行し、ERR_PNPM_IGNORED_BUILDS が報告したパッケージを全数採録した。
#   増減した場合は同じ手順で測り直すこと。**依存パッケージのメジャー更新を行ったら必ず測り直す**
#   （m18-t8 で electron-builder 24→26 の際に electron-winstaller が増え、CI が停止した）。

allowBuilds:
  "@parcel/watcher": true
  electron: true
  esbuild: true
  less: true
  # m18-t8(2026-08-09): electron-builder 26 化で electron-builder-squirrel-windows 経由に
  # 入ってきた。install スクリプトは vendor/7z-<arch>.exe を vendor/7z.exe へコピーするだけ
  # （ネットワークアクセスなし・実読で確認）だが、**我々の Windows ターゲットは nsis であり
  # Squirrel を使わない**ため実行する理由がない。false は「明示的に拒否」の意味で、
  # 未記載のときの ERR_PNPM_IGNORED_BUILDS も出さない（pnpm 11 の仕様）。
  electron-winstaller: false

overrides:
  # 12 月の Core は RC まで npm に出ないため、IIIF の配信と書誌の関数が入った commit を指す。RC の日に外す
  "@maplat/core": "github:code4history/MaplatCore#4bb44575438d6683871f4138d1c4500808eb9e66"
  # @maplat/ui が引く Core は npm の版のままにする（Editor は UI の dist だけを使う。git の依存を推移で入れると
  # pnpm 11 の blockExoticSubdeps で install が止まる）
  "@maplat/ui>@maplat/core": "^1.2.0-rc.1"
  # eslint / vitest まわりが引く js-yaml。>=4.0.0 <4.3.1 の high。4系の最新へ留める。
  js-yaml: "^4.3.1"
  # nov26 m9/DC5: http-cache-semantics 4.2.0 の high は 4.2.1 で修正。4.3.0 を当てる
  # （経路は electron-builder > app-builder-lib > ... のビルド時のみ）
  http-cache-semantics: "^4.3.0"

# ---- 恒久 override（m1-t3）----
# 第三者依存の脆弱性。上流の更新を待つしかないため恒久。
# audit の下限（>=X）ではなく系列を留める spec を書くこと（>=X だと未検証の上位メジャーを引く）。
#   例: path-to-regexp は page@1.11.6 が 1.x API 前提のため ~1.9.0 に留める（>=1.9.0 だと 8.4.2 へ解決して壊れる）。
#
# brace-expansion（GHSA-q2hr-2g5m-vwhr 等）: nov26-m9-t2・t3 で再評価した（2026-10）。
#   MaplatEditor の lock の brace-expansion は 2.x だけ（minimatch 9 系）で、下の override（^2.1.7）が修正版へ留めている。
#   旧注記の前提（require("brace-expansion") を関数として呼ぶ minimatch 3.x・pwa-asset-generator > pretty > js-beautify の経路）は
#   lock に存在しない。
  # ajv は経路を限定する。無指定だと 8.20.0 が workbox-build / app-builder-lib 側にも効き、
  # Quyuan のビルドが strict mode エラー（additionalItems is ignored...）で落ちる（実測）。
  # 脆弱経路は electron-store > conf > (ajv-formats >) ajv のみ。
  "conf>ajv": "^8.18.0"
  "ajv-formats>ajv": "^8.18.0"
  # 2026-10-03 Dependabot（MaplatEditor 1.1.0-rc.2）: brace-expansion GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7（High）/
  # GHSA-q2hr-2g5m-vwhr（Medium）は 2.1.7 で修正。経路は electron-builder（ビルド時）
  brace-expansion: "^2.1.7"
  # 2026-10-03: fast-uri GHSA-hrr3-gc8f-f4qj（Medium）は 3.1.8 で修正。経路は electron-store（実行時）
  # 2026-10-28: GHSA-w74x-v6f9-j3xg・GHSA-wjr9-j795-jxcr（Medium）・GHSA-xhq7-xmqj-769h・GHSA-333x-w4r6-6crp（Low）は 3.1.9 で修正
  fast-uri: "^3.1.9"
  file-type: "^21.3.1"
  ip-address: "^10.3.1"
  minimatch: "^9.0.7"
  # 2026-11-02: minimatch GHSA-g3hv-75wg-m249（medium・<11.0.1。9・10 系に修正版なし）と
  # glob GHSA-3g3m-2fjr-6pw4（medium・>=9.0.0 <=14.0.1・14.0.2 で修正）。上の全体の minimatch は 9 系へ寄せるので、
  # 親を指定して 11 系へ上げる。経路はすべて開発時（eslint・vue-tsc・electron-builder・pwa-asset-generator）。
  # 各親が使う API（minimatch()・Minimatch#match・minimatch.match()）は 11 系にもあり、同じ結果を返す（実測）。
  # @electron/asar と dir-compare は CJS で default を読むが、default は 9 系にも 11 系にも無く、振る舞いは変わらない。
  # glob 7（@electron/asar と electron-winstaller > temp > rimraf が引く）は Minimatch#set の中身に頼り、
  # minimatch 11 では何も一致しなくなる（実測）ので 9 系のまま残す。上流の electron-builder 26.18 も
  # @electron/asar 3.4.1（glob 7）を固定しているため、それが上がるまでこの経路の警告は残る。
  # glob 10・11 も minimatch 11 と組めないので、glob の下は親の版を 14 に限る
  "js-beautify>glob": "^14.0.2"
  "glob@14>minimatch": "^11.0.1"
  "editorconfig>minimatch": "^11.0.1"
  "eslint>minimatch": "^11.0.1"
  "@eslint/config-array>minimatch": "^11.0.1"
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  "@vue/language-core>minimatch": "^11.0.1"
  "app-builder-lib>minimatch": "^11.0.1"
  "@electron/asar>minimatch": "^11.0.1"
  "@electron/universal>minimatch": "^11.0.1"
  "dir-compare>minimatch": "^11.0.1"
  "filelist>minimatch": "^11.0.1"
  # 全体の brace-expansion: "^2.1.7" が minimatch 11 の brace-expansion まで 2 系へ寄せる。minimatch 11 は
  # brace-expansion 5 の名前つきの expand を使い、2 系では TypeError になる（実測）ので、宣言どおり 5 系へ戻す
  "minimatch@11>brace-expansion": "^5.0.12"
  nanoid: "^3.3.18"
  # page@1.11.6 は 1.x の API を前提にするので、親を page に限って 1.9 系に留める。全体に掛けると
  # express 5（@modelcontextprotocol/sdk の推移依存）の router が要求する 8 系まで 1.9 系に押し込む
  "page>path-to-regexp": "~1.9.0"
  postcss: "^8.5.23"
  # 2026-10-03: undici GHSA-rfgv-xxqx-mfg5・GHSA-w293-vg96-wgc3（High）ほかは 7.29.1 で修正。経路は pwa-asset-generator（実行時）と node-gyp（ビルド時）
  # 2026-11-04: GHSA-xjj6-f33q-929c（High）は 7 系では 7.30.1 で修正。lock は既に 7.30.1 なので、宣言の下限をそれに揃える
  undici: "^7.30.1"
  # extract-zip（high×2・修正版なし）→ Electron 公式の置換 fork。経路は pwa-asset-generator → @puppeteer/browsers（oct26-m5-t12）。electron 側は 40.10.3 以降が置換 fork を直接使う（nov26-m6-t2）
  "@puppeteer/browsers>extract-zip": "npm:@electron-internal/extract-zip@^1.0.5"
  # 2026-10-17（nov26 m13・E-9）: basic-ftp <=6.2.0 の high は 6.2.1 で修正。経路は pwa-asset-generator >
  # puppeteer-core > @puppeteer/browsers > proxy-agent > pac-proxy-agent > get-uri（実行時・FTP の PAC 取得だけ）。
  # get-uri は最新の 8.0.1 でも basic-ftp ^5.3.1 を宣言するため、範囲の中では直らない。get-uri が使う API
  # （Client・access・lastMod・downloadTo・list・close）は 6 系にもある（6.2.3 で実測）。経路を get-uri に限定する
  "get-uri>basic-ftp": "^6.2.1"
  # 2026-10-30（MaplatEditor#206）: zod GHSA-mrhx-c7xc-m3w5（high・3 系に修正版なし・4.6.6 で修正）。経路は
  # jimp 1.6.1 の各プラグイン（@jimp/plugin-*・@jimp/types が `zod ^3.23.8` を宣言）だけで、jimp が使う API
  # （z.object/number/tuple/union/literal/nativeEnum/instanceof・.min/.max/.optional/.parse）は 4 系の classic にも
  # 同じ形で存在する（全 16 パッケージの dist で全数確認・2026-10-30）。jimp が zod 4 対応版を出したらこの行を外す。
  zod: "^4.6.7"
  # rollup は 4.62.4 に留める。vite 7.3.7 の下で新しい rollup を使うと dist のチャンクの分け方が変わる
  # （2026-11-04 に 4.67.4 で実測: dist のファイル 797→819）。アプリの出力を保つため、ここだけは完全一致で留める。
  # 次の見直し: 2027-01-15
  rollup: "4.62.4"

# 自組織パッケージは publisher が我々自身のため、pnpm 11 既定の 24h 隔離
# （minimumReleaseAge=1440・サプライチェーン保護）の対象外とする。第三者依存への
# 保護は既定のまま維持する。リリーストレインの publish 直後に CI が自パッケージを
# 解決できるようにする恒久設定（m9-t0。rc1 publish 直後の全 CI が
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION で停止した実測に基づく）
minimumReleaseAgeExclude:
  - "@maplat/*"
  - "@c4h/*"
